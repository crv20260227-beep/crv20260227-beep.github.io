<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tesla Login Callback</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f9;">
    <h2 style="color: #333;">登入授權成功！</h2>
    <p style="color: #666; margin-bottom: 30px;">正在自動返回 MyTeslaApp...</p>
    
    <a id="returnBtn" href="#" style="display: inline-block; background: #D32F2F; color: white; padding: 16px 32px; text-decoration: none; border-radius: 8px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">點擊此處手動返回 App</a>

    <script>
        // 取得當前網址的所有參數 (包含 code 與 state)
        const search = window.location.search;
        
        // 組合自訂通道的返回網址
        const customSchemeUrl = "myteslaapp://callback" + search;
        
        // 設定按鈕的連結
        const btn = document.getElementById('returnBtn');
        btn.href = customSchemeUrl;

        // 頁面載入後 0.5 秒自動嘗試觸發跳轉
        window.onload = function() {
            setTimeout(function() {
                window.location.href = customSchemeUrl;
            }, 500);
        };
    </script>
</body>
</html>
